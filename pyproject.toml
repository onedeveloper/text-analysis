[project]
name = "text-analysis"
version = "0.2.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "nltk>=3.9.1",
    "spacy[apple]>=3.8.5",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "transformers>=4.49.0",
    "torch>=2.6.0",
    "pytextrank>=0.5.0",
]

[project.scripts]
text-analyse = "text_analysis.cli:_main"

[project.optional-dependencies]
full = [
    "spacy[transformers]>=3.8.5",
    "torch>=2.0.0",
    "transformers>=4.36.0",
]
